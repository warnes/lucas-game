[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucas-game"
version = "1.0.0"
description = "Interactive color and sound keyboard game"
authors = [{name = "Gregory R. Warnes", email = "greg@warnes.net"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/warnes/lucas-game"
Repository = "https://github.com/warnes/lucas-game"

[project.scripts]
lucas-game = "random_color_screen:main"
