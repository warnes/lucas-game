[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucas-game"
version = "1.1.0"
description = "Fullscreen keyboard game with configurable exit shortcut and optional audio"
authors = [{name = "Gregory R. Warnes", email = "greg@warnes.net"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
	"pygame",
	"platformdirs",
]

[project.optional-dependencies]
audio = [
	"numpy",
	"sounddevice",
]

[project.urls]
Homepage = "https://github.com/warnes/lucas-game"
Repository = "https://github.com/warnes/lucas-game"

[project.scripts]
lucas-game = "lucas_game:main"

[tool.setuptools]
py-modules = ["lucas_game"]
